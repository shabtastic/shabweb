name: Sync from CV bib

# Pulls the CV repo's bib files, re-runs sync-bib.js to update
# data/publications.json + graph/graph.json, re-runs inline-graph.js
# to push the updated graph data into index.html and graph.html,
# then commits + pushes if anything changed.
#
# Runs daily, plus a manual trigger.

on:
  schedule:
    - cron: '17 6 * * *'  # 06:17 UTC daily (off-the-hour avoids GH peak)
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout website
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Clone CV repo (shallow, public)
        run: git clone --depth 1 https://github.com/shabtastic/cv-that-is-awesome.git /tmp/cv

      - name: Sync from bib
        env:
          CV_PATH: /tmp/cv
        run: node data/sync-bib.js

      - name: Inline graph data into HTML
        run: node data/inline-graph.js

      - name: Commit if changed
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes to sync."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/publications.json graph/graph.json index.html graph.html
          git commit -m "chore: sync from CV bib

          Pulled latest bib files from shabtastic/cv-that-is-awesome
          and re-ran sync-bib.js + inline-graph.js."
          git push
