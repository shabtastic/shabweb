<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>LinkedIn banner</title>
<style>body{margin:0;background:#f5f2ec}#banner{display:block;width:1584px;height:396px}</style></head>
<body><canvas id="banner" width="3168" height="792"></canvas>
<script>
(function(){
const W=1584,H=396,INK='#1a2c6b',PAL=['#7777FF','#C977FF','#FF77E4','#FF7792','#FFAE77','#FFFF77','#77FFE4','#AAFF77'];
function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hex(col,a){const n=parseInt(col.slice(1),16);return`rgba(${n>>16},${n>>8&255},${n&255},${a})`}
function paper(c){c.fillStyle='#f5f2ec';c.fillRect(0,0,W,H);
  for(const [s,col] of [[16,'rgba(80,140,200,0.08)'],[80,'rgba(80,140,200,0.17)']]){c.strokeStyle=col;c.lineWidth=1;c.beginPath();
    for(let x=0;x<=W;x+=s){c.moveTo(x+.5,0);c.lineTo(x+.5,H)}for(let y=0;y<=H;y+=s){c.moveTo(0,y+.5);c.lineTo(W,y+.5)}c.stroke()}}

function sweep(c,cx,cy,an,len,wid,swirl,col,al,start){const p=[];
  for(let i=0;i<=30;i++){const t=i/30,a=an+swirl*t*t,r=start+len*t;p.push([cx+Math.cos(a)*r,cy+Math.sin(a)*r])}
  const L=[],R=[];p.forEach((q,i)=>{const a=p[Math.max(0,i-1)],b=p[Math.min(30,i+1)],dx=b[0]-a[0],dy=b[1]-a[1],m=Math.hypot(dx,dy)||1,t=i/30,w=wid*Math.pow(Math.sin(Math.PI*Math.pow(t,.62)),.8)/2;
    L.push([q[0]-dy/m*w,q[1]+dx/m*w]);R.push([q[0]+dy/m*w,q[1]-dx/m*w])});
  c.fillStyle=hex(col,al);c.beginPath();L.forEach((q,i)=>i?c.lineTo(...q):c.moveTo(...q));R.reverse().forEach(q=>c.lineTo(...q));c.closePath();c.fill()}

// strokes start clear of the centre; a few big ones lead, the rest follow
function soft(c,cx,cy,an,len,wid,sw,col,al,st,r){for(let k=0;k<3;k++)sweep(c,cx,cy,an+(r()-.5)*.012,len*(1-.03*k),wid*(1-.14*k),sw,col,al*.45,st+k*3)}
function erupt(c,cx,cy,r,{reach,cols,maxX,debris}){c.globalCompositeOperation='multiply';
  const big=[-1.02,-.5,-.12,.34,.82,1.16];
  big.forEach((b,i)=>soft(c,cx,cy,b+(r()-.5)*.14,reach*(.78+r()*.4)*(.74+.42*Math.cos(b)),66+r()*44,(r()-.5)*.8,cols[i%cols.length],.44,44+r()*40,r));
  for(let i=0;i<26;i++){const an=(r()<.5?-1:1)*Math.pow(r(),.8)*1.42,len=reach*(.25+.75*Math.pow(r(),1.4))*(.74+.42*Math.cos(an));
    soft(c,cx,cy,an,len,7+Math.pow(r(),1.8)*30,(r()-.5)*1.2,cols[Math.floor(r()*cols.length)],.4,52+r()*90,r)}
  c.globalCompositeOperation='source-over';
  const g=c.createRadialGradient(cx,cy,6,cx,cy,74);g.addColorStop(0,'rgba(255,255,119,.95)');g.addColorStop(.45,'rgba(255,255,119,.4)');g.addColorStop(1,'rgba(255,255,119,0)');
  c.fillStyle=g;c.beginPath();c.arc(cx,cy,74,0,7);c.fill();
  c.strokeStyle=hex(INK,.55);c.lineWidth=1;for(let i=0;i<30;i++){const an=(r()-.5)*2.7,a=52+r()*30,b=a+40+Math.pow(r(),2)*reach*.75;
    c.beginPath();c.moveTo(cx+Math.cos(an)*a,cy+Math.sin(an)*a);c.lineTo(cx+Math.cos(an)*b,cy+Math.sin(an)*b);c.stroke()}
  for(let i=0;i<(debris?90:80);i++){const an=(r()-.5)*2.9,len=90+Math.pow(r(),.9)*reach,x=cx+Math.cos(an)*len,y=cy+Math.sin(an)*len;if(y<6||y>H-6||x>maxX)continue;
    if(debris){const k=r(),n=k<.5?1:2,dirs=[];c.strokeStyle=INK;c.lineWidth=1.3;
      for(let j=0;j<n;j++){const a=an+(r()-.5)*2.4,l=16+r()*26,ex=x+Math.cos(a)*l,ey=y+Math.sin(a)*l;dirs.push([ex,ey]);c.beginPath();c.moveTo(x,y);c.lineTo(ex,ey);c.stroke()}
      for(const q of [[x,y],...dirs]){c.fillStyle=r()<.5?'#f5f2ec':cols[Math.floor(r()*cols.length)];c.beginPath();c.arc(q[0],q[1],3.4+r()*3.2,0,7);c.fill();c.stroke()}}
    else if(r()<.6){const s=Math.round(x/16)*16,w=Math.round(y/16)*16;c.fillStyle=hex(cols[Math.floor(r()*cols.length)],.8);c.fillRect(s+1,w+1,15,15)}
    else{c.fillStyle='#f5f2ec';c.strokeStyle=INK;c.lineWidth=1.4;c.beginPath();c.arc(x,y,2.5+r()*4.5,0,7);c.fill();c.stroke()}}}

// layered network; returns node positions by layer
function layout(xs,counts,cy,gap){return xs.map((x,l)=>Array.from({length:counts[l]},(_,i)=>({x,y:cy+(i-(counts[l]-1)/2)*gap})))}
function edges(c,L,al){c.strokeStyle=hex(INK,al);c.lineWidth=1;c.beginPath();for(let l=0;l<L.length-1;l++)for(const a of L[l])for(const b of L[l+1]){c.moveTo(a.x,a.y);c.lineTo(b.x,b.y)}c.stroke()}
function nodes(c,L,fill){L.forEach((lay,l)=>lay.forEach(n=>{const R=n.r||(l===L.length-1?9:7.5);c.fillStyle=n.col||fill||'#f5f2ec';c.strokeStyle=INK;c.lineWidth=1.7;c.beginPath();c.arc(n.x,n.y,R,0,7);c.fill();c.stroke();
  if(!n.col){c.fillStyle=INK;c.beginPath();c.arc(n.x,n.y,2.1,0,7);c.fill()}}))}
const inputs=(c,L)=>{c.strokeStyle=INK;c.fillStyle=INK;c.lineWidth=1.5;for(const n of L[0]){const x0=n.x-44,x1=n.x-14;c.beginPath();c.moveTo(x0,n.y);c.lineTo(x1,n.y);c.stroke();c.beginPath();c.moveTo(x1+1,n.y);c.lineTo(x1-6,n.y-3.5);c.lineTo(x1-6,n.y+3.5);c.fill()}};
const SHUF=['#FF77E4','#FFFF77','#7777FF','#FFAE77','#77FFE4','#C977FF','#FF7792','#AAFF77'];

const LF=()=>layout([410,530,650,770,880],[9,7,5,3,1],200,42),LO=()=>layout([255,390,525,660,790],[9,6,4,2,1],200,42);
const arrows=(c,O)=>{c.strokeStyle=INK;c.fillStyle=INK;c.lineWidth=1.5;for(const n of O){c.beginPath();c.moveTo(n.x+13,n.y);c.lineTo(n.x+66,n.y);c.stroke();c.beginPath();c.moveTo(n.x+74,n.y);c.lineTo(n.x+66,n.y-4);c.lineTo(n.x+66,n.y+4);c.fill()}};
const OUT=()=>Array.from({length:8},(_,i)=>({x:1474,y:200+(i-3.5)*46}));
const bez=(p0,p1,p2,p3,t)=>{const q=1-t;return q*q*q*p0+3*q*q*t*p1+3*q*t*t*p2+t*t*t*p3};

(function(){const c=document.getElementById('banner').getContext('2d');c.scale(2,2);paper(c);const r=rng(63),L=LO(),O=OUT();
  erupt(c,790,200,r,{reach:620,cols:SHUF,maxX:1400});
  // thin strokes that tie the burst back to its node
  const r2=rng(88);c.globalCompositeOperation='multiply';
  for(let i=0;i<18;i++){const f=i/17,an=(f-.5)*2.5+(r2()-.5)*.1;sweep(c,790,200,an,85+r2()*125,3+r2()*7,(r2()-.5)*.6,SHUF[i%8],.72,12)}
  c.globalCompositeOperation='source-over';
  O.forEach((n,i)=>{n.col=SHUF[i%SHUF.length];n.r=10;const k=(n.y-200)*.32,x0=804,y0=200+(n.y-200)*.02,x1=1000,y1=200+k*.2,x2=1250,y2=n.y+k*.2;
    c.strokeStyle=hex(INK,.8);
    for(let t=0;t<1;t+=.012){const gap=t<.82&&r()<(1-t/.82)*.72;if(gap)continue;const a=[bez(x0,x1,x2,n.x,t),bez(y0,y1,y2,n.y,t)],b=[bez(x0,x1,x2,n.x,t+.012),bez(y0,y1,y2,n.y,t+.012)];
      c.lineWidth=.9+.8*t;c.beginPath();c.moveTo(...a);c.lineTo(...b);c.stroke()}});
  edges(c,L,.62);nodes(c,L);inputs(c,L);nodes(c,[O]);arrows(c,O)})();
})();
</script>
</body></html>
